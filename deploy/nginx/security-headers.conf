# Security response headers for the static site.
#
# The API sets its own via helmet (CSP, HSTS, X-Frame-Options and the rest are
# visible on any /api/ response). nginx serves every HTML page and asset
# directly, so none of that applied to the documents themselves — the site was
# framable by anyone, which is a clickjacking overlay away from a guest typing
# card details into someone else's page.
#
# `always` matters: without it these are attached to 2xx/3xx only, so error
# pages and redirects would go out bare.
#
# This is included rather than set once at server level because nginx's
# add_header does NOT inherit into a location that declares its own. Several
# locations here set Cache-Control, which would silently drop every header
# below for exactly the assets most worth protecting. Any new location that
# adds a header must include this file too.

# Clickjacking. Both spellings: X-Frame-Options for older agents, and the CSP
# directive that supersedes it for current ones. frame-ancestors is the only
# CSP directive used here on purpose — a full policy has to account for the
# Razorpay checkout script and Google Fonts, and getting script-src wrong
# breaks payments, so that belongs in its own tested change.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;

# Stop content-type sniffing turning an uploaded image into script.
add_header X-Content-Type-Options "nosniff" always;

# Don't leak the full URL (booking codes appear in paths) to third parties.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# HSTS deliberately WITHOUT includeSubDomains. This server block answers for
# the apex as well as www, so includeSubDomains would pin every sibling under
# quadishotels.com to HTTPS — including adminweb.quadishotels.com, which this
# deploy does not control and cannot verify. A year of enforced HTTPS on the
# hosts we do serve is the win; the subdomain sweep is not worth breaking a
# host we cannot test from here.
add_header Strict-Transport-Security "max-age=31536000" always;

# Nothing on the site uses these.
add_header Permissions-Policy "camera=(), microphone=()" always;
